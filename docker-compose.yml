services:
  pipeline:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data
      - model-cache:/root/.cache
      # Host git state — runtime branch detection via detect_branch() in scripts/dashboard/git_utils.py
      - ./.git:/app/.git:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Pipeline parameters (overridable)
      - FRAME_INTERVAL=${FRAME_INTERVAL:-10}
      - MAX_FRAMES=${MAX_FRAMES:-50}
      - SAM2_MODEL=${SAM2_MODEL:-large}
      - COLMAP_MATCHER=${COLMAP_MATCHER:-exhaustive}
      - COLMAP_MAX_FEATURES=${COLMAP_MAX_FEATURES:-8192}
      - COLMAP_IMAGE_SIZE=${COLMAP_IMAGE_SIZE:-2048}
      - COLMAP_USE_GPU=${COLMAP_USE_GPU:-0}
      - COLMAP_DSP_SIFT=${COLMAP_DSP_SIFT:-1}
      - GS2MESH_GS_ITERATIONS=${GS2MESH_GS_ITERATIONS:-5000}
      - GS2MESH_PRESET=${GS2MESH_PRESET:-default}
      - GS2MESH_RUNTIME_PROFILE=${GS2MESH_RUNTIME_PROFILE:-auto}
      - GS2MESH_STEREO_MODEL=${GS2MESH_STEREO_MODEL:-DLNR}
      - GS2MESH_TSDF_VOXEL_SIZE=${GS2MESH_TSDF_VOXEL_SIZE:-0.005}
      - GS2MESH_TSDF_DEPTH_TRUNC=${GS2MESH_TSDF_DEPTH_TRUNC:-0.04}
      - GS2MESH_USE_MASKS=${GS2MESH_USE_MASKS:-1}
      - GS2MESH_MASK_DEPTH_MODE=${GS2MESH_MASK_DEPTH_MODE:-crop}
      - GS2MESH_SILHOUETTE_FILL=${GS2MESH_SILHOUETTE_FILL:-}
      - GS2MESH_SILHOUETTE_DEPTH_MODE=${GS2MESH_SILHOUETTE_DEPTH_MODE:-}
      - GS2MESH_SILHOUETTE_VOXELS=${GS2MESH_SILHOUETTE_VOXELS:-}
      - GS2MESH_SILHOUETTE_MIN_VIEWS=${GS2MESH_SILHOUETTE_MIN_VIEWS:-3}
      - GS2MESH_SILHOUETTE_CONSENSUS=${GS2MESH_SILHOUETTE_CONSENSUS:-0.85}
      - GS2MESH_SILHOUETTE_MASK_DILATE_PX=${GS2MESH_SILHOUETTE_MASK_DILATE_PX:-2}
      - TEXTURE_SIZE=${TEXTURE_SIZE:-0}
      - TEXTURE_VIEW_ASSIGN_MODE=${TEXTURE_VIEW_ASSIGN_MODE:-legacy}
      - TEXTURE_COLOR_HARDENING=${TEXTURE_COLOR_HARDENING:-true}
      - TEXTURE_COLOR_HARDENING_THRESHOLD=${TEXTURE_COLOR_HARDENING_THRESHOLD:-0.18}

volumes:
  model-cache:
