services:
  pipeline:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data
      - model-cache:/root/.cache
      # Host git state — runtime branch detection via detect_branch() in scripts/dashboard/git_utils.py
      - ./.git:/app/.git:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Pipeline parameters (overridable)
      - FRAME_INTERVAL=${FRAME_INTERVAL:-10}
      - MAX_FRAMES=${MAX_FRAMES:-50}
      - SAM2_MODEL=${SAM2_MODEL:-large}
      - COLMAP_MATCHER=${COLMAP_MATCHER:-exhaustive}
      - COLMAP_MAX_FEATURES=${COLMAP_MAX_FEATURES:-8192}
      - COLMAP_IMAGE_SIZE=${COLMAP_IMAGE_SIZE:-2048}
      - COLMAP_USE_GPU=${COLMAP_USE_GPU:-0}
      - COLMAP_DSP_SIFT=${COLMAP_DSP_SIFT:-1}
      - COLMAP_FILTER_ENABLED=${COLMAP_FILTER_ENABLED:-1}
      - COLMAP_FILTER_MIN_INSIDE_VIEWS=${COLMAP_FILTER_MIN_INSIDE_VIEWS:-2}
      - COLMAP_FILTER_MIN_INSIDE_RATIO=${COLMAP_FILTER_MIN_INSIDE_RATIO:-0.6}
      - COLMAP_FILTER_MASK_DILATE=${COLMAP_FILTER_MASK_DILATE:-1}
      - COLMAP_FILTER_MIN_POINTS=${COLMAP_FILTER_MIN_POINTS:-200}
      - MILO_ITERATIONS=${MILO_ITERATIONS:-18000}
      - MILO_PRESET=${MILO_PRESET:-default}
      - MILO_SCENE_TYPE=${MILO_SCENE_TYPE:-indoor}
      - MILO_MESH_CONFIG=${MILO_MESH_CONFIG:-default}
      - MILO_EXTRACTION_METHOD=${MILO_EXTRACTION_METHOD:-sdf}
      - MILO_USE_MASKS=${MILO_USE_MASKS:-1}
      - TEXTURE_SIZE=${TEXTURE_SIZE:-0}
      - TEXTURE_VIEW_ASSIGN_MODE=${TEXTURE_VIEW_ASSIGN_MODE:-legacy}

volumes:
  model-cache:
