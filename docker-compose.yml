services:
  pipeline:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data
      - model-cache:/root/.cache
    environment:
      # Git branch for object isolation (auto-detect: GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD) docker compose up)
      - GIT_BRANCH=${GIT_BRANCH:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Pipeline parameters (overridable)
      - FRAME_INTERVAL=${FRAME_INTERVAL:-10}
      - MAX_FRAMES=${MAX_FRAMES:-50}
      - SAM2_MODEL=${SAM2_MODEL:-large}
      - COLMAP_MATCHER=${COLMAP_MATCHER:-exhaustive}
      - COLMAP_MAX_FEATURES=${COLMAP_MAX_FEATURES:-8192}
      - COLMAP_IMAGE_SIZE=${COLMAP_IMAGE_SIZE:-2048}
      - COLMAP_USE_GPU=${COLMAP_USE_GPU:-0}
      - COLMAP_DSP_SIFT=${COLMAP_DSP_SIFT:-1}
      - GWRAPPING_ITERATIONS=${GWRAPPING_ITERATIONS:-30000}
      - GWRAPPING_PRESET=${GWRAPPING_PRESET:-default}
      - GWRAPPING_RASTERIZER=${GWRAPPING_RASTERIZER:-ours}
      - GWRAPPING_RESOLUTION=${GWRAPPING_RESOLUTION:-2}
      - GWRAPPING_USE_MASKS=${GWRAPPING_USE_MASKS:-1}
      - TEXTURE_SIZE=${TEXTURE_SIZE:-0}
      - TEXTURE_VIEW_ASSIGN_MODE=${TEXTURE_VIEW_ASSIGN_MODE:-legacy}

volumes:
  model-cache:
