services:
  pipeline:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data
      - model-cache:/root/.cache
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.8
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Pipeline parameters (overridable)
      - FRAME_INTERVAL=${FRAME_INTERVAL:-10}
      - MAX_FRAMES=${MAX_FRAMES:-50}
      - PIXEL_LIMIT=${PIXEL_LIMIT:-255000}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.2}
      - EDGE_RTOL=${EDGE_RTOL:-0.03}
      - ALIGN_CAMERA_PLANE=${ALIGN_CAMERA_PLANE:-1}
      - SAM2_MODEL=${SAM2_MODEL:-large}
      - DIFFCD_BATCH_SIZE=${DIFFCD_BATCH_SIZE:-5000}
      - DIFFCD_N_BATCHES=${DIFFCD_N_BATCHES:-40000}
      - DIFFCD_RESOLUTION=${DIFFCD_RESOLUTION:-512}
      - DIFFCD_AUTO_TUNE=${DIFFCD_AUTO_TUNE:-1}
      - DIFFCD_AUTO_TUNE_RESPECT_MANUAL=${DIFFCD_AUTO_TUNE_RESPECT_MANUAL:-1}
      - DIFFCD_AUTO_KEEP_EFFECTIVE_SAMPLES=${DIFFCD_AUTO_KEEP_EFFECTIVE_SAMPLES:-1}
      - DIFFCD_AUTO_MIN_N_BATCHES=${DIFFCD_AUTO_MIN_N_BATCHES:-10000}
      - DIFFCD_AUTO_SELECT_GPU=${DIFFCD_AUTO_SELECT_GPU:-1}
      - DIFFCD_GPU_INDEX=${DIFFCD_GPU_INDEX:-}
      - DIFFCD_XLA_MEM_FRACTION=${DIFFCD_XLA_MEM_FRACTION:-}
      - JAX_COMPILATION_CACHE_DIR=${JAX_COMPILATION_CACHE_DIR:-/root/.cache/jax_compilation_cache}
      - TEXTURE_SIZE=${TEXTURE_SIZE:-2048}
    # stdin_open/tty removed — dashboard is non-interactive

volumes:
  model-cache:
