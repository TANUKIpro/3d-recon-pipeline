[project]
name = "clip2mesh"
version = "0.1.0"
description = "Docker-based 3D reconstruction pipeline: image → point cloud → mesh"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0,<2.0",
    "einops",
    "timm",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart",
    "opencv-python-headless>=4.8.0",
    "plyfile>=1.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "open3d>=0.17.0",
    "trimesh>=3.20.0",
    "xatlas",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "tyro",
    "optax",
    "flax",
    "hydra-core",
    "iopath",
    "wandb",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Tests"]
asyncio_mode = "auto"
markers = [
    "gpu: GPU推論が必要なテスト",
    "slow: 30秒以上かかるテスト",
]
